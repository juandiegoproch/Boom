<!DOCTYPE html>
<html>
<head>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 4rem;
            text-shadow: 3px 3px 8px black;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="jamon.jpg">
        <h1>Te gusta tu regalo, boom?</h1>
    </div>
</body>
</html>
