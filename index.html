
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .container::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.55),
                rgba(0, 0, 0, 0.15) 50%,
                rgba(0, 0, 0, 0.45)
            );
            pointer-events: none;
        }

        h1 {
            position: absolute;
            top: 8vh;
            left: 5%;
            width: 90%;
            margin: 0;
            text-align: center;
            color: white;
            font-size: clamp(2rem, 8vw, 4.5rem);
            line-height: 1.1;
            text-shadow:
                3px 3px 8px black,
                -1px -1px 4px rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        p {
            margin: 1.5rem auto 0;
            max-width: 900px;
            font-size: clamp(1.1rem, 4vw, 2rem);
            line-height: 1.3;
            font-weight: 500;

            /* Oculto inicialmente */
            opacity: 0;

            /* Aparece después de 5 segundos */
            animation: aparecer 1.5s ease forwards;
            animation-delay: 5s;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            h1 {
                top: 10vh;
                width: 92%;
                left: 4%;
            }

            p {
                margin-top: 1rem;
            }

            img {
                object-position: center;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="jamon.jpg" alt="Tu regalo">

        <h1>
            Te gusta tu regalo, boom?
            <p>
                Pero tienes que esperarte unos 20 días...
            </p>
        </h1>
    </div>
</body>
</html>
